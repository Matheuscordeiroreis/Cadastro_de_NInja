<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <title> Criar nova Missão </title>
</head>
<body>
<div class="container mt-5">
    <form th:action="@{/missoes/ui/salvar}" th:object="${missoes}" method="post">

        <h1 class="text-center mb-4">Adicionar missão</h1>

        <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" class="form-control" id="nome" th:field="*{nomemissao}" placeholder="Nome:" >
        </div>


        <div class="mb-3">
            <label for="niveldedificuldade" class="form-label">Nivel de Dificuldade</label>
            <input type="text" class="form-control" id="niveldedificuldade" th:field="*{niveldedificuldade}" placeholder="Nivel de dificuldade">
        </div>

        <div class="text-center mt-4">
            <button type="submit" class="btn btn-primary px-5">Salvar Missão</button>
        </div>

    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
