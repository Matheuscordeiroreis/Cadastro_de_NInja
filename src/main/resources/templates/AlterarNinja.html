<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <title> Atualizar ninja</title>
</head>
<body>
<div class="container mt-5">
    <form th:action="@{/ninjas/ui/salvarAlterado}" th:object="${ninjaAtualizado}" method="post">
        <input type="hidden" th:field="*{id}">

        <h1 class="text-center mb-4">Atualizar ninja</h1>

        <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" class="form-control" id="nome" th:field="*{nome}" placeholder="Nome:" >
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="text" class="form-control" id="email" th:field="*{email}" placeholder="example@email.com">
        </div>

        <div class="mb-3">
            <label for="idade" class="form-label">Idade</label>
            <input type="number" class="form-control" id="idade" th:field="*{idade}" placeholder="Idade">
        </div>

        <div class="mb-3">
            <label for="rank" class="form-label">Rank</label>
            <input type="text" class="form-control" id="rank" th:field="*{rank}" placeholder="Rank">
        </div>

        <div class="mb-3">
            <label for="opcao" class="form-label">Missoes:</label>
            <select id="opcao" th:field="*{missoes}" class="form-select">
                <option value="">Selecione...</option>
                <option th:each="opt : ${ListadeMissoes}"
                        th:value="${opt.id}"
                        th:text="${opt.nomemissao}"></option>
            </select>
        </div>

        <div class="text-center mt-4">
            <button type="submit" class="btn btn-primary px-5">Salvar Ninja</button>
        </div>

    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
